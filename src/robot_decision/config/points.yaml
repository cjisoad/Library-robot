cruise:
  loop: true
  point_order:
    - point1
    - point2


fine_tune:
  enabled: true
  trigger_mode: selected  # all 表示所有巡航点都微调，selected 表示只微调列表里的点
  trigger_points:
    - point2
  adjacent_points:
    point2: point3
  start_service: /fine_tune/start
  parameter_service: /fine_tune_node/set_parameters
  settle_delay_sec: 2.0
  wait_for_terminal_continue: true
  cmd_vel_topic: /cmd_vel
  target_frame: map
  base_frame: base_link
  control_rate_hz: 8.0
  x_tolerance: 0.02
  y_tolerance: 0.20
  yaw_tolerance: 0.03
  max_linear_speed: 0.2
  max_angular_speed: 0.3
  k_x: 1.0
  k_y: 1.0
  k_yaw: 1.5
  stage_timeout_sec: 30.0
  timeout_sec: 90.0

points:
  point1: # outside
    frame_id: map
    x: -2.569545
    y: 2.735969
    z: 0.0
    yaw: -1.621221
  point2: # r o o m
    frame_id: map
    x: -1.136041
    y: 0.059923
    z: 0.0
    yaw: -1.136322
  point3: #target
    frame_id: map
    x: -1.005207
    y: -0.204674
    z: 0.0
    yaw: 0.487588
