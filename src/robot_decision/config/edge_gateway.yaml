edge_gateway_node:
  ros__parameters:
    # Keep this identity unique for each physical robot.
    robot_id: "LR-01"

    # Set this to the control-platform computer's LAN IP before customer delivery.
    # A real deployment also uses a per-robot account and TLS.
    mqtt_host: "127.0.0.1"
    mqtt_port: 1883
    mqtt_protocol_version: "3.1.1"
    mqtt_tls_enabled: false
    mqtt_ca_file: ""
    mqtt_username: ""
    mqtt_password: ""

    # This must match the map version selected in LR-Web and loaded by Nav2.
    allowed_map_ids:
      - "MAP-F18C1F27DC2E"
    active_map_id: "MAP-F18C1F27DC2E"
    # Bounds of the enabled 302 laboratory map, in ROS map coordinates (metres).
    map_min_x: -4.441
    map_max_x: 3.879
    map_min_y: -1.751
    map_max_y: 5.209
    max_abs_yaw: 6.284

    command_queue_size: 10
    navigate_action_name: "navigate_to_pose"
    # Publish through Nav2's velocity smoother and collision monitor. The
    # chassis itself remains subscribed only to collision_monitor's /cmd_vel.
    manual_cmd_vel_topic: "/cmd_vel_nav"
    manual_command_timeout_seconds: 1.0
    amcl_pose_topic: "/amcl_pose"
    initial_pose_topic: "/initialpose"
    localization_status_topic: "/localization/status"
    localization_scan_mode_topic: "/localization/scan_mode"
    chassis_status_topic: "/wheel_speed_source"
    chassis_status_timeout_seconds: 2.5
    # MotorStudio is a loopback-only service on the robot. The Edge Gateway
    # calls it locally and reports only sanitized readiness/task state.
    bookarm_api_url: "http://127.0.0.1:18080/api/v1"
    bookarm_timeout_seconds: 3.0
    bookarm_poll_period_seconds: 1.0
    bookarm_rod_device: "/dev/rodmotor"
    bookarm_lift_device: "/dev/lift_port"
    telemetry_period_seconds: 0.5
    # Do not timestamp an old AMCL coordinate as if it were newly measured.
    pose_stale_timeout_seconds: 5.0
    max_position_variance: 0.5
    max_yaw_variance: 0.35
